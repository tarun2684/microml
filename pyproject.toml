[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microml"
version = "0.1.0"
description = "Lightweight classical machine learning algorithms built from scratch with NumPy"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scikit-learn>=1.0.0"
]